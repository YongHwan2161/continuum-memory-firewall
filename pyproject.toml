[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum-memory-firewall"
version = "0.1.0"
description = "Evidence-first persistent memory for long-running AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Yonghwan Kim" }
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
continuum = ["migrations/*.sql"]

[project.optional-dependencies]
cockroach = [
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4"
]
mcp = [
  "boto3>=1.40,<2",
  "cryptography>=45,<51",
  "mcp>=1.27,<2",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic>=2.11,<3"
]
dev = [
  "boto3>=1.40,<2",
  "cryptography>=45,<51",
  "mcp>=1.27,<2",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic>=2.11,<3",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4"
]
test = [
  "cryptography>=45,<51",
  "hypothesis>=6.140,<7"
]

[project.scripts]
continuum-mcp = "continuum.mcp_server:main"
continuum-migrate = "continuum.migrate:main"
continuum-db-smoke = "continuum.db_smoke:main"
continuum-provision-sql-roles = "continuum.sql_roles:main"
continuum-provision-scope-role = "continuum.scope_roles:main"
continuum-semantic-eval = "continuum.evaluation:main"
