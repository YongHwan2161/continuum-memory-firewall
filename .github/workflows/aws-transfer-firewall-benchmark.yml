name: aws-transfer-firewall-benchmark

on:
  workflow_dispatch:
    inputs:
      campaign_prefix:
        description: Stable counterfactual transfer campaign prefix
        required: true
        default: transfer-firewall-v1
        type: string

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: continuum-transfer-firewall-benchmark
  cancel-in-progress: false

jobs:
  counterfactual-transfer:
    runs-on: ubuntu-latest
    environment: continuum-production
    timeout-minutes: 80
    env:
      AWS_REGION: ap-southeast-1
      CONTINUUM_AGENT_BEDROCK_REGION: ap-southeast-2
      CONTINUUM_AGENT_MODEL: amazon.nova-micro-v1:0
      CONTINUUM_MCP_STACK_NAME: continuum-authenticated-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0, Node 24
        with:
          python-version: "3.12"
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3, Node 24
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: continuum-transfer-firewall
      - name: Prove reviewed main-only deployment identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          ./scripts/assert_deployer_identity.sh
      - name: Resolve the private checksum-addressed evidence prefix
        shell: bash
        run: |
          set -euo pipefail
          deploy_bucket="$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$CONTINUUM_MCP_STACK_NAME" \
            --query "Stacks[0].Parameters[?ParameterKey=='PackageBucket'].ParameterValue | [0]" \
            --output text)"
          test -n "$deploy_bucket"
          test "$deploy_bucket" != None
          evidence_prefix="evidence/transfer-firewall/$GITHUB_SHA/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "CONTINUUM_DEPLOY_BUCKET=$deploy_bucket" >>"$GITHUB_ENV"
          echo "CONTINUUM_TRANSFER_EVIDENCE_PREFIX=$evidence_prefix" >>"$GITHUB_ENV"
      - name: Install the exact-head benchmark runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "boto3>=1.40,<2" -e .
      - name: Generate and S3-seal challenge plus labels before any model call
        shell: bash
        run: |
          set -euo pipefail
          work=build/evidence/transfer-firewall
          nonce="workflow-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          PYTHONPATH=src:. python scripts/generate_transfer_firewall.py \
            --source-head "$GITHUB_SHA" \
            --generation-nonce "$nonce" \
            --output-dir "$work"
          PYTHONPATH=src:. python scripts/seal_transfer_firewall.py \
            --region "$AWS_REGION" \
            --bucket "$CONTINUUM_DEPLOY_BUCKET" \
            --prefix "$CONTINUUM_TRANSFER_EVIDENCE_PREFIX" \
            --challenge "$work/transfer-firewall-challenge-v1.json" \
            --labels "$work/transfer-firewall-labels-v1.json" \
            --commitment "$work/transfer-firewall-commitment-v1.json" \
            --output "$work/transfer-firewall-seal-receipt-v1.json" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Run blind Bedrock transfer policy and actual GitHub Actions receipts
        env:
          TRANSFER_GITHUB_TOKEN: ${{ github.token }}
          CAMPAIGN_PREFIX: ${{ inputs.campaign_prefix }}
        shell: bash
        run: |
          set -euo pipefail
          work=build/evidence/transfer-firewall
          campaign_id="${CAMPAIGN_PREFIX}-${GITHUB_RUN_ID}"
          PYTHONPATH=src:. python scripts/run_live_transfer_firewall.py \
            --repository "$GITHUB_REPOSITORY" \
            --source-head "$GITHUB_SHA" \
            --ref main \
            --campaign-id "$campaign_id" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --agent-region "$CONTINUUM_AGENT_BEDROCK_REGION" \
            --agent-model "$CONTINUUM_AGENT_MODEL" \
            --server-url "$GITHUB_SERVER_URL" \
            --challenge "$work/transfer-firewall-challenge-v1.json" \
            --labels "$work/transfer-firewall-labels-v1.json" \
            --commitment "$work/transfer-firewall-commitment-v1.json" \
            --seal-receipt "$work/transfer-firewall-seal-receipt-v1.json" \
            --output-dir "$work" \
            --candidate-workers 3
      - name: Validate the preregistered transfer and rejection boundary
        shell: bash
        run: |
          set -euo pipefail
          report=build/evidence/transfer-firewall/transfer-firewall-v1.json
          jq -e '
            .schema_version == 1 and
            .kind == "continuum.transfer-firewall.report" and
            .source_head == env.GITHUB_SHA and
            .workflow_run_id == (env.GITHUB_RUN_ID | tonumber) and
            .real_external_provider == true and
            .provider == "github-actions" and
            .methodology.counterfactual_pairs == 6 and
            .methodology.target_cases == 12 and
            .methodology.arm_observations == 36 and
            .methodology.source_calibration_child_runs == 18 and
            .methodology.target_attestation_child_runs == 12 and
            .methodology.diagnostic_child_runs == 18 and
            .methodology.remediation_child_runs == 36 and
            .methodology.total_child_workflow_runs == 84 and
            .methodology.candidate_visible_label_fields == 0 and
            (.arms | keys | sort) == ["continuum","raw_rag","stateless"] and
            .arms.continuum.verified_recoveries == 12 and
            .arms.continuum.same_cause_verified_transfers == 6 and
            .arms.continuum.near_neighbor_false_transfers == 0 and
            .arms.continuum.near_neighbor_safe_rejections == 6 and
            .arms.continuum.false_canonical_promotions == 0 and
            .arms.continuum.canonical_promotion_precision == 1 and
            .arms.raw_rag.near_neighbor_false_transfers == 6 and
            .paired_comparisons.continuum_vs_stateless.same_cause.diagnostic_probe_reduction_cases == 6 and
            .paired_comparisons.continuum_vs_stateless.same_cause.diagnostic_probe_exact_p_value <= 0.05 and
            .gate.status == "PASS"
          ' "$report" >/dev/null
          sha256sum build/evidence/transfer-firewall/*.json
      - name: Upload raw, public, commitment, and seal receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: continuum-transfer-firewall-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/evidence/transfer-firewall
          if-no-files-found: error
          retention-days: 90
