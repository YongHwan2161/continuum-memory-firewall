name: public-demo

on:
  workflow_dispatch:
    inputs:
      coordinator_workflow_run_id:
        description: Exact release transaction coordinator run
        required: false
        default: ""
      coordinator_source_digest:
        description: Exact coordinator workflow source SHA
        required: false
        default: ""
      coordinator_artifact_id:
        description: Exact coordinator artifact ID
        required: false
        default: ""
      coordinator_artifact_digest:
        description: Exact coordinator artifact digest
        required: false
        default: ""

permissions:
  actions: read
  attestations: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0, Node 24

      - name: Materialize the signed envelope bundle
        env:
          GH_TOKEN: ${{ github.token }}
          COORDINATOR_RUN_ID_INPUT: ${{ inputs.coordinator_workflow_run_id }}
          COORDINATOR_SOURCE_INPUT: ${{ inputs.coordinator_source_digest }}
          COORDINATOR_ARTIFACT_ID_INPUT: ${{ inputs.coordinator_artifact_id }}
          COORDINATOR_ARTIFACT_DIGEST_INPUT: ${{ inputs.coordinator_artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          cp -a public-demo build-pages
          judge=public-demo/evidence/judge-verification.json
          tag="$(jq -r '.release_envelope.tag' "$judge")"
          asset="$(jq -r '.network_sign_once.author_bundle_asset_name' "$judge")"
          network_file="$(jq -r '.network_sign_once.network_bundle_file_name' "$judge")"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" \
              --dir build-pages/evidence
            receipt="$(gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
            expected="$(jq -r --arg asset "$asset" \
              '.assets[] | select(.name == $asset) | .digest' <<<"$receipt")"
            actual="sha256:$(sha256sum "build-pages/evidence/$asset" | cut -d' ' -f1)"
            test "$actual" = "$expected"
            mkdir -p "$RUNNER_TEMP/network-sign-once"
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern continuum-release-envelope-v2.json \
              --dir "$RUNNER_TEMP/network-sign-once"
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern release-transaction-receipt.json \
              --dir "$RUNNER_TEMP/network-sign-once"
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern judge-offline-capsule-v1.json \
              --dir build-pages/evidence
            cp "$RUNNER_TEMP/network-sign-once/continuum-release-envelope-v2.json" \
              build-pages/evidence/continuum-release-envelope-v2.json
            envelope_public="build-pages/evidence/continuum-release-envelope-v2.json"
            capsule_public="build-pages/evidence/judge-offline-capsule-v1.json"
            envelope_expected="$(jq -r '.assets[] | select(.name == "continuum-release-envelope-v2.json") | .digest' <<<"$receipt")"
            capsule_expected="$(jq -r '.assets[] | select(.name == "judge-offline-capsule-v1.json") | .digest' <<<"$receipt")"
            envelope_actual="sha256:$(sha256sum "$envelope_public" | cut -d' ' -f1)"
            capsule_actual="sha256:$(sha256sum "$capsule_public" | cut -d' ' -f1)"
            test "$envelope_actual" = "$envelope_expected"
            test "$capsule_actual" = "$capsule_expected"
            python -m scripts.offline_judge_capsule verify \
              --capsule "$capsule_public" \
              --envelope "$envelope_public"
            offline_capsule_sha256="${capsule_actual#sha256:}"
            offline_capsule_receipt_sha256="$(jq -r '.receipt_sha256' "$capsule_public")"

            coordinator_run_id="$COORDINATOR_RUN_ID_INPUT"
            coordinator_source_digest="$COORDINATOR_SOURCE_INPUT"
            coordinator_artifact_id="$COORDINATOR_ARTIFACT_ID_INPUT"
            coordinator_artifact_digest="$COORDINATOR_ARTIFACT_DIGEST_INPUT"
            if [ -z "$coordinator_run_id" ]; then
              coordinator_run="$(gh run list \
                --workflow release-envelope.yml \
                --status success \
                --limit 1 \
                --json databaseId,headSha,url \
                --jq '.[0]')"
              coordinator_run_id="$(jq -r '.databaseId' <<<"$coordinator_run")"
              coordinator_source_digest="$(jq -r '.headSha' <<<"$coordinator_run")"
              coordinator_artifacts="$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$coordinator_run_id/artifacts")"
              coordinator_artifact="$(jq -c \
                --arg name "release-transaction-$tag-$coordinator_source_digest" \
                '.artifacts | map(select(.name == $name)) | if length == 1 then .[0] else error("coordinator artifact not unique") end' \
                <<<"$coordinator_artifacts")"
              coordinator_artifact_id="$(jq -r '.id' <<<"$coordinator_artifact")"
              coordinator_artifact_digest="$(jq -r '.digest' <<<"$coordinator_artifact")"
            fi
            [[ "$coordinator_run_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$coordinator_source_digest" =~ ^[0-9a-f]{40}$ ]]
            [[ "$coordinator_artifact_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$coordinator_artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

            for attempt in $(seq 1 12); do
              coordinator_run="$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$coordinator_run_id")"
              if [ "$(jq -r '.conclusion' <<<"$coordinator_run")" = success ]; then
                break
              fi
              sleep 5
            done
            test "$(jq -r '.conclusion' <<<"$coordinator_run")" = success
            test "$(jq -r '.head_sha' <<<"$coordinator_run")" = "$coordinator_source_digest"
            coordinator_artifact="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$coordinator_artifact_id")"
            coordinator_artifact_name="release-transaction-$tag-$coordinator_source_digest"
            test "$(jq -r '.name' <<<"$coordinator_artifact")" = "$coordinator_artifact_name"
            test "$(jq -r '.digest' <<<"$coordinator_artifact")" = "$coordinator_artifact_digest"
            test "$(jq -r '.expired' <<<"$coordinator_artifact")" = false
            test "$(jq -r '.workflow_run.id' <<<"$coordinator_artifact")" = "$coordinator_run_id"
            mkdir -p "$RUNNER_TEMP/release-coordinator"
            gh run download "$coordinator_run_id" \
              --name "$coordinator_artifact_name" \
              --dir "$RUNNER_TEMP/release-coordinator"
            coordinator_receipt="$RUNNER_TEMP/release-coordinator/release-transaction-receipt.json"
            python scripts/release_transaction_coordinator.py verify \
              --input "$coordinator_receipt" \
              --expected-state IMMUTABLE
            test "$(jq -r '.release_tag' "$coordinator_receipt")" = "$tag"
            test "$(jq -r '.source_digest' "$coordinator_receipt")" = \
              "$(jq -r '.target_commitish' <<<"$receipt")"
            test "$(jq -r '.transaction_id' "$coordinator_receipt")" = \
              "$(jq -r '.transaction_id' "$RUNNER_TEMP/network-sign-once/release-transaction-receipt.json")"
            coordinator_receipt_sha256="$(jq -r '.receipt_sha256' "$coordinator_receipt")"
            (
              cd "$RUNNER_TEMP/network-sign-once"
              gh attestation download continuum-release-envelope-v2.json \
                --repo "$GITHUB_REPOSITORY"
              mapfile -t bundles < <(find . -maxdepth 1 -type f -name 'sha256:*.jsonl')
              test "${#bundles[@]}" = 1
              test "$(wc -l <"${bundles[0]}")" = 2
              mv "${bundles[0]}" "$GITHUB_WORKSPACE/build-pages/evidence/$network_file"
            )

            envelope_digest="$(jq -r '.envelope_sha256' "$RUNNER_TEMP/network-sign-once/release-transaction-receipt.json")"
            author_count="$(gh api --method GET \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/attestations/sha256:$envelope_digest" \
              -f 'predicate_type=https://slsa.dev/provenance/v1' \
              --jq '.attestations | length')"
            platform_count="$(gh api --method GET \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/attestations/sha1:$(jq -r '.target_commitish' <<<"$receipt")" \
              -f 'predicate_type=https://in-toto.io/attestation/release/v0.2' \
              --jq '.attestations | length')"
            test "$author_count" = 1
            test "$platform_count" = 1
            jq -n \
              --arg release_target "$(jq -r '.target_commitish' <<<"$receipt")" \
              --arg release_tag "$tag" \
              '{immutable:true,release_draft:false,release_target:$release_target,release_tag:$release_tag,author_attestation_count:1,platform_attestation_count:1,total_attestation_count:2}' \
              >"$RUNNER_TEMP/network-sign-once/immutable.json"
            python scripts/release_transaction_coordinator.py advance \
              --input "$RUNNER_TEMP/network-sign-once/release-transaction-receipt.json" \
              --to-state IMMUTABLE \
              --evidence "$RUNNER_TEMP/network-sign-once/immutable.json" \
              --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --output "$RUNNER_TEMP/network-sign-once/immutable-receipt.json"
            network_sha="$(sha256sum "build-pages/evidence/$network_file" | cut -d' ' -f1)"
            jq -n \
              --argjson pages_workflow_run_id "$GITHUB_RUN_ID" \
              --arg pages_workflow_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --arg pages_source_digest "$GITHUB_SHA" \
              --argjson coordinator_workflow_run_id "$coordinator_run_id" \
              --arg coordinator_workflow_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$coordinator_run_id" \
              --arg coordinator_source_digest "$coordinator_source_digest" \
              --argjson coordinator_artifact_id "$coordinator_artifact_id" \
              --arg coordinator_artifact_name "$coordinator_artifact_name" \
              --arg coordinator_artifact_digest "$coordinator_artifact_digest" \
              --arg coordinator_receipt_sha256 "$coordinator_receipt_sha256" \
              --arg public_receipt_url "https://yonghwan2161.github.io/continuum-memory-firewall/evidence/release-transaction-receipt.json" \
              --arg release_tag "$tag" \
              --arg release_target "$(jq -r '.target_commitish' <<<"$receipt")" \
              --arg public_bundle_sha256 "$network_sha" \
              --arg offline_judge_capsule_sha256 "$offline_capsule_sha256" \
              --arg offline_judge_capsule_receipt_sha256 "$offline_capsule_receipt_sha256" \
              --arg offline_judge_capsule_public_url "https://yonghwan2161.github.io/continuum-memory-firewall/evidence/judge-offline-capsule-v1.json" \
              '{status:"success",pages_workflow_run_id:$pages_workflow_run_id,pages_workflow_url:$pages_workflow_url,pages_source_digest:$pages_source_digest,coordinator_workflow_run_id:$coordinator_workflow_run_id,coordinator_workflow_url:$coordinator_workflow_url,coordinator_source_digest:$coordinator_source_digest,coordinator_artifact_id:$coordinator_artifact_id,coordinator_artifact_name:$coordinator_artifact_name,coordinator_artifact_digest:$coordinator_artifact_digest,coordinator_receipt_sha256:$coordinator_receipt_sha256,public_receipt_url:$public_receipt_url,release_tag:$release_tag,release_target:$release_target,public_bundle_sha256:$public_bundle_sha256,offline_judge_capsule_sha256:$offline_judge_capsule_sha256,offline_judge_capsule_receipt_sha256:$offline_judge_capsule_receipt_sha256,offline_judge_capsule_public_url:$offline_judge_capsule_public_url}' \
              >"$RUNNER_TEMP/network-sign-once/pages.json"
            python scripts/release_transaction_coordinator.py advance \
              --input "$RUNNER_TEMP/network-sign-once/immutable-receipt.json" \
              --to-state PAGES_MATERIALIZED \
              --evidence "$RUNNER_TEMP/network-sign-once/pages.json" \
              --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --output build-pages/evidence/release-transaction-receipt.json
            python scripts/release_transaction_coordinator.py verify \
              --input build-pages/evidence/release-transaction-receipt.json \
              --expected-state PAGES_MATERIALIZED
          else
            echo "::error::signed release is pending; refusing to publish an incomplete proof console"
            exit 1
          fi
          test -s build-pages/evidence/release-transaction-receipt.json

      - name: Upload public proof console
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0; embeds upload-artifact v7, Node 24
        with:
          path: build-pages

      - name: Wait for Pages artifact availability
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            count="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')"
            if [ "$count" = 1 ]; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::github-pages artifact did not become API-visible"
          exit 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0, Node 24

      - name: Verify the materialized transaction receipt
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum build-pages/evidence/release-transaction-receipt.json | cut -d' ' -f1)"
          url="https://yonghwan2161.github.io/continuum-memory-firewall/evidence/release-transaction-receipt.json?run=$GITHUB_RUN_ID"
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error "$url" \
                --output "$RUNNER_TEMP/public-release-transaction-receipt.json" && \
               [ "$(sha256sum "$RUNNER_TEMP/public-release-transaction-receipt.json" | cut -d' ' -f1)" = "$expected" ]; then
              break
            fi
            sleep 5
          done
          test "$(sha256sum "$RUNNER_TEMP/public-release-transaction-receipt.json" | cut -d' ' -f1)" = "$expected"
          python scripts/release_transaction_coordinator.py verify \
            --input "$RUNNER_TEMP/public-release-transaction-receipt.json" \
            --expected-state PAGES_MATERIALIZED
