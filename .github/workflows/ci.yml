name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic policy tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  cockroach-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and CockroachDB driver
        run: python -m pip install -e '.[cockroach]'
      - name: Install CockroachDB v26.2.3
        run: |
          curl --fail --location --retry 3 \
            --output cockroach.tgz \
            https://binaries.cockroachdb.com/cockroach-v26.2.3.linux-amd64.tgz
          tar --extract --gzip --file cockroach.tgz --strip-components=1 \
            cockroach-v26.2.3.linux-amd64/cockroach
      - name: Start disposable CockroachDB
        run: |
          ./cockroach start-single-node \
            --insecure \
            --listen-addr=127.0.0.1:26257 \
            --http-addr=127.0.0.1:8080 \
            --background
      - name: Run CockroachDB transaction tests
        env:
          CONTINUUM_DATABASE_URL: >-
            postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable
        run: make integration
      - name: Stop CockroachDB
        if: always()
        run: ./cockroach quit --insecure --host=127.0.0.1:26257 || true
