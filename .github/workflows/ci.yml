name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: "3.12"
      - name: Install property-test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run deterministic policy tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  mcp-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: "3.12"
      - name: Install project and MCP SDK
        run: python -m pip install -e '.[mcp]'
      - name: Validate MCP tool contract in memory
        run: make mcp-test

  cloud-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: "3.12"
      - name: Validate AWS template and deployment scripts
        run: |
          for template in infra/aws/*.json; do
            python -m json.tool "$template" >/dev/null
          done
          bash -n scripts/*.sh
      - name: Build the Lambda manylinux package
        run: |
          ./scripts/build_lambda_package.sh
          unzip -t build/aws/continuum-managed-mcp-worker.zip

  cockroach-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: "3.12"
      - name: Install project and CockroachDB driver
        run: python -m pip install -e '.[cockroach]'
      - name: Install CockroachDB v26.2.3
        run: |
          curl --fail --location --retry 3 \
            --output cockroach.tgz \
            https://binaries.cockroachdb.com/cockroach-v26.2.3.linux-amd64.tgz
          tar --extract --gzip --file cockroach.tgz --strip-components=1 \
            cockroach-v26.2.3.linux-amd64/cockroach
      - name: Start disposable CockroachDB
        run: |
          mkdir -p certs
          ./cockroach cert create-ca \
            --certs-dir=certs \
            --ca-key=certs/ca.key
          ./cockroach cert create-node localhost 127.0.0.1 ::1 \
            --certs-dir=certs \
            --ca-key=certs/ca.key
          ./cockroach cert create-client root \
            --certs-dir=certs \
            --ca-key=certs/ca.key
          ./cockroach start-single-node \
            --certs-dir=certs \
            --listen-addr=127.0.0.1:26257 \
            --http-addr=127.0.0.1:8080 \
            --pid-file=cockroach.pid \
            --background
          ./cockroach sql --certs-dir=certs \
            --execute "ALTER USER root WITH PASSWORD 'integration-root-password-only';"
      - name: Run migrations and CockroachDB smoke tests
        env:
          CONTINUUM_DATABASE_URL: >-
            postgresql://root:integration-root-password-only@localhost:26257/defaultdb?sslmode=verify-full&sslrootcert=${{ github.workspace }}/certs/ca.crt
        run: make integration
      - name: Stop CockroachDB
        if: always()
        run: |
          if [[ -f cockroach.pid ]]; then
            kill "$(cat cockroach.pid)"
          fi
