name: aws-identity-proof

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  prove-keyless-deployer:
    runs-on: ubuntu-latest
    environment: continuum-production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record non-secret OIDC claims
        shell: bash
        run: |
          oidc_token="$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" |
            python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          OIDC_TOKEN="$oidc_token" python -c \
            'import base64,json,os; p=os.environ["OIDC_TOKEN"].split(".")[1]; p += "="*((4-len(p)%4)%4); c=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:c.get(k) for k in ("sub","aud","ref")},sort_keys=True))'
          unset oidc_token
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: continuum-oidc-proof
      - name: Prove exact deployment role
        run: ./scripts/assert_deployer_identity.sh
      - name: Record short-lived role proof
        run: aws sts get-caller-identity --query Arn --output text
