name: immutable-release-envelope

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: New or resumable immutable GitHub Release tag
        required: true
        default: hackathon-v33
      release_target:
        description: Exact existing release target to reconcile; blank uses the workflow SHA
        required: false
        default: ""

permissions:
  actions: write
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: release-transaction-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: "3.12"

      - name: Inspect or resume the durable release transaction
        id: transaction
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TARGET_INPUT: ${{ inputs.release_target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release "$RUNNER_TEMP/release-transaction"
          release_target="${RELEASE_TARGET_INPUT:-$GITHUB_SHA}"
          [[ "$release_target" =~ ^[0-9a-f]{40}$ ]]
          releases="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          release="$(jq -c --arg tag "$RELEASE_TAG" \
            '[.[] | select(.tag_name == $tag)] | if length == 0 then empty elif length == 1 then .[0] else error("duplicate release tag") end' \
            <<<"$releases")"
          if [ -n "$release" ]; then
            test "$(jq -r '.target_commitish' <<<"$release")" = "$release_target"
            if [ "$(jq -r '.immutable' <<<"$release")" = true ]; then
              mode=immutable
            elif [ "$(jq -r '.draft' <<<"$release")" = true ]; then
              mode=draft
            else
              echo "existing release is neither a resumable draft nor immutable" >&2
              exit 1
            fi
          else
            test "$release_target" = "$GITHUB_SHA"
            mode=new
          fi
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          echo "release_target=$release_target" >>"$GITHUB_OUTPUT"
          echo "RELEASE_TARGET=$release_target" >>"$GITHUB_ENV"
          echo "transaction mode: $mode"
          echo "release target: $release_target"

      - name: Revalidate referenced workflow receipts
        if: steps.transaction.outputs.mode == 'new'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          judge=public-demo/evidence/judge-verification.json
          for plane in source vector_scale agent_pressure managed_mcp sandbox_provider agent_ablation release_guardian time_distributed_replication blind_holdout sequential_blind_campaign ci_recovery adaptive_diagnosis transfer_firewall online_memory_lineage outcome_replay_cas kms_outcome_authority; do
            case "$plane" in
              source)
                run_id="$(jq -r '.source.workflow_run_id' "$judge")"
                expected_head="$(jq -r '.source.deployment_head_sha' "$judge")"
                ;;
              vector_scale)
                run_id="$(jq -r '.vector_scale.workflow_run_id' "$judge")"
                expected_head="$(jq -r '.vector_scale.head_sha' "$judge")"
                ;;
              agent_pressure)
                run_id="$(jq -r '.agent_pressure.workflow_run_id' "$judge")"
                expected_head="$(jq -r '.agent_pressure.head_sha' "$judge")"
                ;;
              managed_mcp)
                run_id="$(jq -r '.managed_mcp.rotation_workflow_run_id' "$judge")"
                expected_head=""
                ;;
              sandbox_provider)
                run_id="$(jq -r '.sandbox_provider.workflow_run_id' "$judge")"
                expected_head="$(jq -r '.sandbox_provider.head_sha' "$judge")"
                ;;
              agent_ablation)
                run_id="$(jq -r '.agent_ablation.workflow_run_id' "$judge")"
                expected_head="$(jq -r '.agent_ablation.head_sha' "$judge")"
                ;;
              release_guardian)
                run_id="$(jq -r '.release_guardian.workflow_run_id' "$judge")"
                expected_head="$(jq -r '.release_guardian.head_sha' "$judge")"
                ;;
              time_distributed_replication)
                run_id="$(jq -r '.time_distributed_replication.workflow_run_id' "$judge")"
                expected_head="$(jq -r '.time_distributed_replication.head_sha' "$judge")"
                ;;
              blind_holdout)
                run_id="$(jq -r '.blind_holdout.workflow_run_id' "$judge")"
                expected_head="$(jq -r '.blind_holdout.head_sha' "$judge")"
                ;;
              sequential_blind_campaign)
                run_id="$(jq -r '.sequential_blind_campaign.workflow_run_id' "$judge")"
                expected_head="$(jq -r '.sequential_blind_campaign.evaluator_head_sha // .sequential_blind_campaign.head_sha' "$judge")"
                ;;
              ci_recovery)
                run_id="$(jq -r '.ci_recovery.workflow_run_id' "$judge")"
                expected_head="$(jq -r '.ci_recovery.head_sha' "$judge")"
                ;;
              adaptive_diagnosis)
                run_id="$(jq -r '.adaptive_diagnosis.workflow_run_id' "$judge")"
                expected_head="$(jq -r '.adaptive_diagnosis.head_sha' "$judge")"
                ;;
              transfer_firewall)
                run_id="$(jq -r '.transfer_firewall.workflow_run_id' "$judge")"
                expected_head="$(jq -r '.transfer_firewall.head_sha' "$judge")"
                ;;
              online_memory_lineage)
                run_id="$(jq -r '.online_memory_lineage.workflow_run_id' "$judge")"
                expected_head="$(jq -r '.online_memory_lineage.reconciler_head_sha' "$judge")"
                ;;
              outcome_replay_cas)
                run_id="$(jq -r '.outcome_replay_cas.workflow_run_id' "$judge")"
                expected_head="$(jq -r '.outcome_replay_cas.head_sha' "$judge")"
                ;;
              kms_outcome_authority)
                run_id="$(jq -r '.kms_outcome_authority.workflow_run_id' "$judge")"
                expected_head="$(jq -r '.kms_outcome_authority.head_sha' "$judge")"
                ;;
            esac
            provider_receipt="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            test "$(jq -r '.conclusion' <<<"$provider_receipt")" = success
            if [ -n "$expected_head" ]; then
              test "$(jq -r '.head_sha' <<<"$provider_receipt")" = "$expected_head"
            fi
          done
          candidate_run_id="$(jq -r '.sequential_blind_campaign.candidate_workflow_run_id // empty' "$judge")"
          if [ -n "$candidate_run_id" ]; then
            candidate_receipt="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id")"
            test "$(jq -r '.run_attempt' <<<"$candidate_receipt")" = \
              "$(jq -r '.sequential_blind_campaign.candidate_workflow_attempt' "$judge")"
            test "$(jq -r '.head_sha' <<<"$candidate_receipt")" = \
              "$(jq -r '.sequential_blind_campaign.head_sha' "$judge")"
            test "$(jq -r '.conclusion' <<<"$candidate_receipt")" = failure
          fi
          lineage_candidate_run_id="$(jq -r '.online_memory_lineage.predecessor_workflow_run_id' "$judge")"
          lineage_candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$lineage_candidate_run_id")"
          test "$(jq -r '.head_sha' <<<"$lineage_candidate")" = \
            "$(jq -r '.online_memory_lineage.candidate_head_sha' "$judge")"
          test "$(jq -r '.conclusion' <<<"$lineage_candidate")" = failure
          for action_run_id in $(jq -r '.online_memory_lineage.provider_action_run_ids[]' "$judge"); do
            action_receipt="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$action_run_id")"
            test "$(jq -r '.head_sha' <<<"$action_receipt")" = \
              "$(jq -r '.online_memory_lineage.candidate_head_sha' "$judge")"
            test "$(jq -r '.conclusion' <<<"$action_receipt")" = success
          done

      - name: Download and bind exact historical and CI-recovery artifacts
        if: steps.transaction.outputs.mode == 'new'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          judge=public-demo/evidence/judge-verification.json
          mkdir -p build/evidence/sandbox build/evidence/ablation build/evidence/guardian build/evidence/replication build/evidence/blind build/evidence/sequential build/evidence/ci-recovery build/evidence/adaptive-diagnosis build/evidence/transfer-firewall build/evidence/online-lineage build/evidence/outcome-replay-cas build/evidence/kms-authority
          for plane in sandbox_provider agent_ablation release_guardian time_distributed_replication blind_holdout sequential_blind_campaign ci_recovery adaptive_diagnosis transfer_firewall online_memory_lineage outcome_replay_cas kms_outcome_authority; do
            artifact_id="$(jq -r ".$plane.artifact_id" "$judge")"
            artifact_name="$(jq -r ".$plane.artifact_name" "$judge")"
            expected_archive="sha256:$(jq -r ".$plane.artifact_archive_sha256" "$judge")"
            provider_receipt="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")"
            test "$(jq -r '.expired' <<<"$provider_receipt")" = false
            test "$(jq -r '.name' <<<"$provider_receipt")" = "$artifact_name"
            test "$(jq -r '.digest' <<<"$provider_receipt")" = "$expected_archive"
            target=build/evidence/sandbox
            if [ "$plane" = agent_ablation ]; then target=build/evidence/ablation; fi
            if [ "$plane" = release_guardian ]; then target=build/evidence/guardian; fi
            if [ "$plane" = time_distributed_replication ]; then target=build/evidence/replication; fi
            if [ "$plane" = blind_holdout ]; then target=build/evidence/blind; fi
            if [ "$plane" = sequential_blind_campaign ]; then target=build/evidence/sequential; fi
            if [ "$plane" = ci_recovery ]; then target=build/evidence/ci-recovery; fi
            if [ "$plane" = adaptive_diagnosis ]; then target=build/evidence/adaptive-diagnosis; fi
            if [ "$plane" = transfer_firewall ]; then target=build/evidence/transfer-firewall; fi
            if [ "$plane" = online_memory_lineage ]; then target=build/evidence/online-lineage; fi
            if [ "$plane" = outcome_replay_cas ]; then target=build/evidence/outcome-replay-cas; fi
            if [ "$plane" = kms_outcome_authority ]; then target=build/evidence/kms-authority; fi
            gh run download \
              "$(jq -r ".$plane.workflow_run_id" "$judge")" \
              --name "$artifact_name" \
              --dir "$target"
          done
          test "$(sha256sum build/evidence/sandbox/sandbox-provider-proof.json | cut -d' ' -f1)" = \
            "$(jq -r '.sandbox_provider.report_sha256' "$judge")"
          test "$(sha256sum build/evidence/ablation/agent-ablation.json | cut -d' ' -f1)" = \
            "$(jq -r '.agent_ablation.report_sha256' "$judge")"
          test "$(sha256sum build/evidence/ablation/episode-drilldown-v1.json | cut -d' ' -f1)" = \
            "$(jq -r '.episode_drilldown.sha256' "$judge")"
          cmp build/evidence/ablation/episode-drilldown-v1.json \
            public-demo/evidence/episode-drilldown-v1.json
          test "$(sha256sum build/evidence/guardian/release-guardian-v1.json | cut -d' ' -f1)" = \
            "$(jq -r '.release_guardian.report_sha256' "$judge")"
          test "$(sha256sum build/evidence/replication/release-guardian-replication-v1.json | cut -d' ' -f1)" = \
            "$(jq -r '.time_distributed_replication.report_sha256' "$judge")"
          test "$(sha256sum build/evidence/replication/release-guardian-replication-public-v1.json | cut -d' ' -f1)" = \
            "$(jq -r '.time_distributed_replication.public_sha256' "$judge")"
          cmp build/evidence/replication/release-guardian-replication-public-v1.json \
            public-demo/evidence/release-guardian-replication-v1.json
          test "$(sha256sum build/evidence/blind/blind-holdout-report-v1.json | cut -d' ' -f1)" = \
            "$(jq -r '.blind_holdout.report_sha256' "$judge")"
          test "$(sha256sum build/evidence/blind/blind-holdout-public-v1.json | cut -d' ' -f1)" = \
            "$(jq -r '.blind_holdout.public_sha256' "$judge")"
          cmp build/evidence/blind/blind-holdout-public-v1.json \
            public-demo/evidence/blind-holdout-v1.json
          test "$(sha256sum build/evidence/sequential/campaign-public.json | cut -d' ' -f1)" = \
            "$(jq -r '.sequential_blind_campaign.public_sha256' "$judge")"
          cmp build/evidence/sequential/campaign-public.json \
            public-demo/evidence/sequential-blind-v1.json
          test "$(sha256sum build/evidence/ci-recovery/ci-recovery-v1.json | cut -d' ' -f1)" = \
            "$(jq -r '.ci_recovery.public_sha256' "$judge")"
          cmp build/evidence/ci-recovery/ci-recovery-v1.json \
            public-demo/evidence/ci-recovery-v1.json
          test "$(sha256sum build/evidence/adaptive-diagnosis/adaptive-diagnosis-v1.json | cut -d' ' -f1)" = \
            "$(jq -r '.adaptive_diagnosis.public_sha256' "$judge")"
          cmp build/evidence/adaptive-diagnosis/adaptive-diagnosis-v1.json \
            public-demo/evidence/adaptive-diagnosis-v1.json
          test "$(sha256sum build/evidence/transfer-firewall/transfer-firewall-v1.json | cut -d' ' -f1)" = \
            "$(jq -r '.transfer_firewall.public_sha256' "$judge")"
          cmp build/evidence/transfer-firewall/transfer-firewall-v1.json \
            public-demo/evidence/transfer-firewall-v1.json
          test "$(sha256sum public-demo/evidence/online-memory-lineage-v1.json | cut -d' ' -f1)" = \
            "$(jq -r '.online_memory_lineage.public_sha256' "$judge")"
          test "$(sha256sum build/evidence/outcome-replay-cas/outcome-replay-cas-private-v1.json | cut -d' ' -f1)" = \
            "$(jq -r '.outcome_replay_cas.private_report_sha256' "$judge")"
          test "$(sha256sum build/evidence/outcome-replay-cas/outcome-replay-cas-v1.json | cut -d' ' -f1)" = \
            "$(jq -r '.outcome_replay_cas.public_sha256' "$judge")"
          cmp build/evidence/outcome-replay-cas/outcome-replay-cas-v1.json \
            public-demo/evidence/outcome-replay-cas-v1.json
          test "$(sha256sum build/evidence/kms-authority/kms-authority-lifecycle-v1.json | cut -d' ' -f1)" = \
            "$(jq -r '.kms_outcome_authority.public_sha256' "$judge")"
          cmp build/evidence/kms-authority/kms-authority-lifecycle-v1.json \
            public-demo/evidence/kms-authority-lifecycle-v1.json
          test "$(sha256sum public-demo/evidence/provider-origin-story-v1.json | cut -d' ' -f1)" = \
            "$(jq -r '.provider_origin_story.public_sha256' "$judge")"
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from continuum.blind_holdout import build_public_blind_holdout
          from continuum.release_guardian import build_public_release_guardian
          from continuum.release_guardian_replication import build_public_release_guardian_replication
          from continuum.sequential_blind import build_public_sequential_blind
          from continuum.ci_recovery import build_public_ci_recovery
          from continuum.adaptive_diagnosis import build_public_adaptive_diagnosis
          from continuum.online_memory_lineage import build_public_online_memory_lineage
          from continuum.outcome_replay_proof import build_public_outcome_replay_proof
          from continuum.kms_authority_proof import validate_kms_authority_proof
          from continuum.provider_origin_story import verify_provider_origin_story
          from continuum.transfer_firewall import build_public_transfer_firewall
          from scripts.promote_online_memory_lineage_evidence import _validate_reconciliation_inputs
          raw = json.loads(Path("build/evidence/guardian/release-guardian-v1.json").read_text())
          public = json.loads(Path("public-demo/evidence/release-guardian-v1.json").read_text())
          if public != build_public_release_guardian(raw):
              raise SystemExit("public guardian projection does not match raw report")
          replication = json.loads(Path("build/evidence/replication/release-guardian-replication-v1.json").read_text())
          replication_public = json.loads(Path("public-demo/evidence/release-guardian-replication-v1.json").read_text())
          if replication_public != build_public_release_guardian_replication(replication):
              raise SystemExit("public replication projection does not match raw report")
          blind_raw = json.loads(Path("build/evidence/blind/blind-holdout-report-v1.json").read_text())
          blind_public = json.loads(Path("public-demo/evidence/blind-holdout-v1.json").read_text())
          if blind_public != build_public_blind_holdout(blind_raw):
              raise SystemExit("public blind holdout projection does not match raw report")
          sequential_raw = json.loads(Path("build/evidence/sequential/campaign-report.json").read_text())
          sequential_public = json.loads(Path("public-demo/evidence/sequential-blind-v1.json").read_text())
          if sequential_public != build_public_sequential_blind(sequential_raw):
              raise SystemExit("public sequential campaign projection does not match raw report")
          ci_raw = json.loads(Path("build/evidence/ci-recovery/ci-recovery-private.json").read_text())
          ci_public = json.loads(Path("public-demo/evidence/ci-recovery-v1.json").read_text())
          if ci_public != build_public_ci_recovery(ci_raw):
              raise SystemExit("public CI recovery projection does not match raw report")
          adaptive_raw = json.loads(Path("build/evidence/adaptive-diagnosis/adaptive-diagnosis-private.json").read_text())
          adaptive_public = json.loads(Path("public-demo/evidence/adaptive-diagnosis-v1.json").read_text())
          if adaptive_public != build_public_adaptive_diagnosis(adaptive_raw):
              raise SystemExit("public adaptive diagnosis projection does not match raw report")
          transfer_raw = json.loads(Path("build/evidence/transfer-firewall/transfer-firewall-private.json").read_text())
          transfer_public = json.loads(Path("public-demo/evidence/transfer-firewall-v1.json").read_text())
          if transfer_public != build_public_transfer_firewall(transfer_raw):
              raise SystemExit("public transfer firewall projection does not match raw report")
          online_raw = json.loads(Path("build/evidence/online-lineage/online-memory-lineage-v1.json").read_text())
          online_public = json.loads(Path("public-demo/evidence/online-memory-lineage-v1.json").read_text())
          if online_public != build_public_online_memory_lineage(online_raw):
              raise SystemExit("public online memory lineage projection does not match raw report")
          outcome_raw = json.loads(Path("build/evidence/outcome-replay-cas/outcome-replay-cas-private-v1.json").read_text())
          outcome_public = json.loads(Path("public-demo/evidence/outcome-replay-cas-v1.json").read_text())
          if outcome_public != build_public_outcome_replay_proof(outcome_raw):
              raise SystemExit("public outcome replay CAS projection does not match raw report")
          kms_authority = json.loads(Path("public-demo/evidence/kms-authority-lifecycle-v1.json").read_text())
          validate_kms_authority_proof(kms_authority)
          provider_story = json.loads(Path("public-demo/evidence/provider-origin-story-v1.json").read_text())
          verify_provider_origin_story(provider_story)
          input_path = Path("build/evidence/online-lineage/reconciliation-input-v1.json")
          proposals_path = Path("build/evidence/online-lineage/predecessor/proposals-v1.json")
          outcomes_path = Path("build/evidence/online-lineage/predecessor/provider-outcomes-v1.json")
          _validate_reconciliation_inputs(
              online_raw,
              reconciliation_input_bytes=input_path.read_bytes(),
              reconciliation_input=json.loads(input_path.read_text()),
              proposals_bytes=proposals_path.read_bytes(),
              proposals=json.loads(proposals_path.read_text()),
              provider_outcomes_bytes=outcomes_path.read_bytes(),
              provider_outcomes=json.loads(outcomes_path.read_text()),
          )
          PY

      - name: Compile the zero-API judge capsule from the prior immutable proof
        if: steps.transaction.outputs.mode == 'new'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src:.
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          relay_enabled="$(jq -r '.offline_judge_capsule.relay.enabled // false' public-demo/evidence/judge-verification.json)"
          if [[ "$relay_enabled" == "true" ]]; then
            source_tag="$(jq -r '.offline_judge_capsule.relay.source_release_tag' public-demo/evidence/judge-verification.json)"
            source_target="$(jq -r '.offline_judge_capsule.relay.source_release_target' public-demo/evidence/judge-verification.json)"
            source_asset_sha="$(jq -r '.offline_judge_capsule.relay.source_asset_sha256' public-demo/evidence/judge-verification.json)"
            source_receipt_sha="$(jq -r '.offline_judge_capsule.relay.source_receipt_sha256' public-demo/evidence/judge-verification.json)"
            source_compiler_run="$(jq -r '.offline_judge_capsule.relay.source_compiler_workflow_run_id' public-demo/evidence/judge-verification.json)"
            failed_pages_run="$(jq -r '.offline_judge_capsule.relay.failed_pages_workflow_run_id' public-demo/evidence/judge-verification.json)"
            source_release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$source_tag")"
            [[ "$(jq -r '.immutable' <<<"$source_release")" == "true" ]]
            [[ "$(jq -r '.draft' <<<"$source_release")" == "false" ]]
            [[ "$(jq -r '.target_commitish' <<<"$source_release")" == "$source_target" ]]
            mapfile -t source_assets < <(jq -r --arg name "judge-offline-capsule-v1.json" '.assets[] | select(.name == $name) | [.id, .digest] | @tsv' <<<"$source_release")
            [[ "${#source_assets[@]}" -eq 1 ]]
            IFS=$'\t' read -r source_asset_id source_asset_digest <<<"${source_assets[0]}"
            [[ "$source_asset_digest" == "sha256:$source_asset_sha" ]]
            source_capsule="$RUNNER_TEMP/judge-offline-capsule-$source_tag.json"
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$source_asset_id" \
              > "$source_capsule"
            [[ "$(sha256sum "$source_capsule" | cut -d' ' -f1)" == "$source_asset_sha" ]]
            [[ "$(jq -r '.receipt_sha256' "$source_capsule")" == "$source_receipt_sha" ]]
            [[ "$(jq -r '.compiler.workflow_run_id' "$source_capsule")" == "$source_compiler_run" ]]
            failed_pages="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$failed_pages_run")"
            [[ "$(jq -r '.conclusion' <<<"$failed_pages")" == "failure" ]]
            [[ "$(jq -r '.head_sha' <<<"$failed_pages")" == "$source_target" ]]
            [[ "$(jq -r '.offline_judge_capsule.relay.source_release_immutable' public-demo/evidence/judge-verification.json)" == "true" ]]
            [[ "$source_compiler_run" =~ ^[1-9][0-9]*$ ]]
            python -m scripts.offline_judge_capsule relay \
              --input "$source_capsule" \
              --expected-asset-sha256 "$source_asset_sha" \
              --expected-receipt-sha256 "$source_receipt_sha" \
              --source-release-tag "$source_tag" \
              --source-release-target "$source_target" \
              --repository "$GITHUB_REPOSITORY" \
              --source-head "$RELEASE_TARGET" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
              --release-tag "$RELEASE_TAG" \
              --failed-pages-workflow-run-id "$failed_pages_run" \
              --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --output build/release/judge-offline-capsule-v1.json
          else
            python -m scripts.offline_judge_capsule build \
              --evidence-url https://yonghwan2161.github.io/continuum-memory-firewall/evidence/judge-verification.json \
              --repository "$GITHUB_REPOSITORY" \
              --source-head "$RELEASE_TARGET" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
              --release-tag "$RELEASE_TAG" \
              --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --output build/release/judge-offline-capsule-v1.json
          fi

      - name: Build the exact release payload once
        if: steps.transaction.outputs.mode == 'new'
        env:
          PYTHONPATH: src:.
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python scripts/build_release_envelope.py \
            --judge-evidence public-demo/evidence/judge-verification.json \
            --scale-evidence public-demo/evidence/vector-scale.json \
            --pressure-evidence public-demo/evidence/agent-pressure.json \
            --sandbox-evidence build/evidence/sandbox/sandbox-provider-proof.json \
            --ablation-evidence build/evidence/ablation/agent-ablation.json \
            --ablation-aggregate public-demo/evidence/agent-ablation-v3.json \
            --episode-drilldown public-demo/evidence/episode-drilldown-v1.json \
            --release-guardian-evidence build/evidence/guardian/release-guardian-v1.json \
            --release-guardian-public public-demo/evidence/release-guardian-v1.json \
            --release-guardian-replication build/evidence/replication/release-guardian-replication-v1.json \
            --blind-holdout-public public-demo/evidence/blind-holdout-v1.json \
            --sequential-blind-public public-demo/evidence/sequential-blind-v1.json \
            --evidence-story public-demo/evidence/evidence-story-v1.json \
            --provider-origin-story public-demo/evidence/provider-origin-story-v1.json \
            --ci-recovery-public public-demo/evidence/ci-recovery-v1.json \
            --adaptive-diagnosis-public public-demo/evidence/adaptive-diagnosis-v1.json \
            --transfer-firewall-public public-demo/evidence/transfer-firewall-v1.json \
            --online-memory-lineage-public public-demo/evidence/online-memory-lineage-v1.json \
            --outcome-replay-cas-public public-demo/evidence/outcome-replay-cas-v1.json \
            --kms-outcome-authority-public public-demo/evidence/kms-authority-lifecycle-v1.json \
            --offline-judge-capsule build/release/judge-offline-capsule-v1.json \
            --repo-root . \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$RELEASE_TARGET" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --release-tag "$RELEASE_TAG" \
            --output build/release/continuum-release-envelope-v2.json
          cp build/evidence/sandbox/sandbox-provider-proof.json \
            build/release/sandbox-provider-proof.json
          cp build/evidence/ablation/agent-ablation.json \
            build/release/agent-ablation-v3.json
          cp public-demo/evidence/episode-drilldown-v1.json \
            build/release/episode-drilldown-v1.json
          cp build/evidence/guardian/release-guardian-v1.json \
            build/release/release-guardian-v1.json
          cp build/evidence/replication/release-guardian-replication-v1.json \
            build/release/release-guardian-replication-v1.json
          cp public-demo/evidence/blind-holdout-v1.json \
            build/release/blind-holdout-v1.json
          cp public-demo/evidence/sequential-blind-v1.json \
            build/release/sequential-blind-v1.json
          cp public-demo/evidence/evidence-story-v1.json \
            build/release/evidence-story-v1.json
          cp public-demo/evidence/provider-origin-story-v1.json \
            build/release/provider-origin-story-v1.json
          cp public-demo/evidence/ci-recovery-v1.json \
            build/release/ci-recovery-v1.json
          cp public-demo/evidence/adaptive-diagnosis-v1.json \
            build/release/adaptive-diagnosis-v1.json
          cp public-demo/evidence/transfer-firewall-v1.json \
            build/release/transfer-firewall-v1.json
          cp public-demo/evidence/online-memory-lineage-v1.json \
            build/release/online-memory-lineage-v1.json
          cp public-demo/evidence/outcome-replay-cas-v1.json \
            build/release/outcome-replay-cas-v1.json
          cp public-demo/evidence/kms-authority-lifecycle-v1.json \
            build/release/kms-authority-lifecycle-v1.json
          (
            cd build/release
            sha256sum sandbox-provider-proof.json >sandbox-provider-proof.json.sha256
            sha256sum agent-ablation-v3.json >agent-ablation-v3.json.sha256
            sha256sum episode-drilldown-v1.json >episode-drilldown-v1.json.sha256
            sha256sum release-guardian-v1.json >release-guardian-v1.json.sha256
            sha256sum release-guardian-replication-v1.json >release-guardian-replication-v1.json.sha256
            sha256sum blind-holdout-v1.json >blind-holdout-v1.json.sha256
            sha256sum sequential-blind-v1.json >sequential-blind-v1.json.sha256
            sha256sum evidence-story-v1.json >evidence-story-v1.json.sha256
            sha256sum provider-origin-story-v1.json >provider-origin-story-v1.json.sha256
            sha256sum ci-recovery-v1.json >ci-recovery-v1.json.sha256
            sha256sum adaptive-diagnosis-v1.json >adaptive-diagnosis-v1.json.sha256
            sha256sum transfer-firewall-v1.json >transfer-firewall-v1.json.sha256
            sha256sum online-memory-lineage-v1.json >online-memory-lineage-v1.json.sha256
            sha256sum outcome-replay-cas-v1.json >outcome-replay-cas-v1.json.sha256
            sha256sum kms-authority-lifecycle-v1.json >kms-authority-lifecycle-v1.json.sha256
          )

      - name: Create the durable draft before author signing
        if: steps.transaction.outputs.mode == 'new'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            build/release/continuum-release-envelope-v2.json \
            build/release/continuum-release-envelope-v2.json.sha256 \
            build/release/sandbox-provider-proof.json \
            build/release/sandbox-provider-proof.json.sha256 \
            build/release/agent-ablation-v3.json \
            build/release/agent-ablation-v3.json.sha256 \
            build/release/episode-drilldown-v1.json \
            build/release/episode-drilldown-v1.json.sha256 \
            build/release/release-guardian-v1.json \
            build/release/release-guardian-v1.json.sha256 \
            build/release/release-guardian-replication-v1.json \
            build/release/release-guardian-replication-v1.json.sha256 \
            build/release/blind-holdout-v1.json \
            build/release/blind-holdout-v1.json.sha256 \
            build/release/sequential-blind-v1.json \
            build/release/sequential-blind-v1.json.sha256 \
            build/release/evidence-story-v1.json \
            build/release/evidence-story-v1.json.sha256 \
            build/release/provider-origin-story-v1.json \
            build/release/provider-origin-story-v1.json.sha256 \
            build/release/ci-recovery-v1.json \
            build/release/ci-recovery-v1.json.sha256 \
            build/release/adaptive-diagnosis-v1.json \
            build/release/adaptive-diagnosis-v1.json.sha256 \
            build/release/transfer-firewall-v1.json \
            build/release/transfer-firewall-v1.json.sha256 \
            build/release/online-memory-lineage-v1.json \
            build/release/online-memory-lineage-v1.json.sha256 \
            build/release/outcome-replay-cas-v1.json \
            build/release/outcome-replay-cas-v1.json.sha256 \
            build/release/kms-authority-lifecycle-v1.json \
            build/release/kms-authority-lifecycle-v1.json.sha256 \
            build/release/judge-offline-capsule-v1.json \
            build/release/judge-offline-capsule-v1.json.sha256 \
            --target "$RELEASE_TARGET" \
            --draft \
            --title "Continuum Memory Firewall evidence envelope" \
            --notes "Resumable release transaction. The draft is created before author signing so a retry reuses the exact envelope and existing attestation."

      - name: Recover durable release assets
        if: steps.transaction.outputs.mode != 'new'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          releases="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          release_id="$(jq -r --arg tag "$RELEASE_TAG" \
            '[.[] | select(.tag_name == $tag)] | if length == 1 then .[0].id else error("release draft not unique") end' \
            <<<"$releases")"
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              >"build/release/$asset_name"
          done < <(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.id,.name] | @tsv')

      - name: Initialize or verify the PREPARED receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TRANSACTION_MODE: ${{ steps.transaction.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          receipt=build/release/release-transaction-receipt.json
          if [ ! -f "$receipt" ]; then
            test "$TRANSACTION_MODE" != immutable
            # A newly-created draft is not always immediately visible from the
            # releases collection. Reconcile by the provider's stable identity
            # tuple instead of assuming read-after-write consistency.
            release=""
            for attempt in $(seq 1 12); do
              releases="$(gh api \
                "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
              release="$(jq -c \
                --arg tag "$RELEASE_TAG" \
                --arg target "$RELEASE_TARGET" \
                '[.[] | select(.tag_name == $tag and .target_commitish == $target and .draft == true)] | if length == 0 then empty elif length == 1 then .[0] else error("duplicate matching release drafts") end' \
                <<<"$releases")"
              if [ -n "$release" ]; then break; fi
              sleep 2
            done
            if [ -z "$release" ]; then
              echo "matching release draft did not become visible" >&2
              exit 1
            fi
            python - <<'PY' >"$RUNNER_TEMP/release-transaction/expected-assets.json"
          import hashlib, json
          from pathlib import Path
          names = (
              "continuum-release-envelope-v2.json",
              "continuum-release-envelope-v2.json.sha256",
              "sandbox-provider-proof.json",
              "sandbox-provider-proof.json.sha256",
              "agent-ablation-v3.json",
              "agent-ablation-v3.json.sha256",
              "episode-drilldown-v1.json",
              "episode-drilldown-v1.json.sha256",
              "release-guardian-v1.json",
              "release-guardian-v1.json.sha256",
              "release-guardian-replication-v1.json",
              "release-guardian-replication-v1.json.sha256",
              "blind-holdout-v1.json",
              "blind-holdout-v1.json.sha256",
              "sequential-blind-v1.json",
              "sequential-blind-v1.json.sha256",
              "evidence-story-v1.json",
              "evidence-story-v1.json.sha256",
              "provider-origin-story-v1.json",
              "provider-origin-story-v1.json.sha256",
              "ci-recovery-v1.json",
              "ci-recovery-v1.json.sha256",
              "adaptive-diagnosis-v1.json",
              "adaptive-diagnosis-v1.json.sha256",
              "transfer-firewall-v1.json",
              "transfer-firewall-v1.json.sha256",
              "online-memory-lineage-v1.json",
              "online-memory-lineage-v1.json.sha256",
              "outcome-replay-cas-v1.json",
              "outcome-replay-cas-v1.json.sha256",
              "kms-authority-lifecycle-v1.json",
              "kms-authority-lifecycle-v1.json.sha256",
              "judge-offline-capsule-v1.json",
              "judge-offline-capsule-v1.json.sha256",
          )
          root = Path("build/release")
          print(json.dumps({name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in names}, sort_keys=True))
          PY
            jq -n \
              --argjson release_id "$(jq '.id' <<<"$release")" \
              --arg release_target "$RELEASE_TARGET" \
              --arg envelope_sha256 "$(sha256sum build/release/continuum-release-envelope-v2.json | cut -d' ' -f1)" \
              --argjson expected_asset_digests "$(cat "$RUNNER_TEMP/release-transaction/expected-assets.json")" \
              '{release_id:$release_id,release_draft:true,release_target:$release_target,envelope_sha256:$envelope_sha256,expected_asset_digests:$expected_asset_digests}' \
              >"$RUNNER_TEMP/release-transaction/prepared.json"
            python scripts/release_transaction_coordinator.py init \
              --repository "$GITHUB_REPOSITORY" \
              --release-tag "$RELEASE_TAG" \
              --source-digest "$RELEASE_TARGET" \
              --envelope-sha256 "$(sha256sum build/release/continuum-release-envelope-v2.json | cut -d' ' -f1)" \
              --evidence "$RUNNER_TEMP/release-transaction/prepared.json" \
              --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --output "$receipt"
            release_id="$(jq -r '.id' <<<"$release")"
            existing_id="$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              --jq '.[] | select(.name == "release-transaction-receipt.json") | .id')"
            if [ -n "$existing_id" ]; then
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$existing_id"
            fi
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              --input "$receipt" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=release-transaction-receipt.json" \
              >/dev/null
          fi
          python scripts/release_transaction_coordinator.py verify --input "$receipt"
          test "$(jq -r '.release_tag' "$receipt")" = "$RELEASE_TAG"
          test "$(jq -r '.source_digest' "$receipt")" = "$RELEASE_TARGET"
          test "$(jq -r '.envelope_sha256' "$receipt")" = \
            "$(sha256sum build/release/continuum-release-envelope-v2.json | cut -d' ' -f1)"

      - name: Reconcile the author attestation before signing
        id: author
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum build/release/continuum-release-envelope-v2.json | cut -d' ' -f1)"
          if author="$(gh api --method GET \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/attestations/sha256:$digest" \
              -f 'predicate_type=https://slsa.dev/provenance/v1' \
              2>"$RUNNER_TEMP/release-transaction/author.err")"; then
            count="$(jq '.attestations | length' <<<"$author")"
          else
            grep -q 'HTTP 404' "$RUNNER_TEMP/release-transaction/author.err"
            count=0
          fi
          rm -f "$RUNNER_TEMP/release-transaction/author.err"
          test "$count" -le 1
          release_id="$(jq -r '.events[0].evidence.release_id' build/release/release-transaction-receipt.json)"
          release="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/releases/$release_id")"
          platform_count=0
          if [ "$(jq -r '.immutable' <<<"$release")" = true ]; then
            platform_count="$(gh api --method GET \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/attestations/sha1:$RELEASE_TARGET" \
              -f 'predicate_type=https://in-toto.io/attestation/release/v0.2' \
              --jq '.attestations | length')"
          fi
          jq -n \
            --arg release_target "$RELEASE_TARGET" \
            --arg envelope_sha256 "$digest" \
            --argjson author_attestation_count "$count" \
            --argjson platform_attestation_count "$platform_count" \
            --argjson immutable "$(jq '.immutable' <<<"$release")" \
            '{release_exists:true,release_target:$release_target,envelope_sha256:$envelope_sha256,author_attestation_count:$author_attestation_count,platform_attestation_count:$platform_attestation_count,immutable:$immutable,expected_asset_digests:{},observed_asset_digests:{},pages:{}}' \
            >"$RUNNER_TEMP/release-transaction/snapshot.json"
          python scripts/release_transaction_coordinator.py reconcile \
            --input build/release/release-transaction-receipt.json \
            --snapshot "$RUNNER_TEMP/release-transaction/snapshot.json" \
            >"$RUNNER_TEMP/release-transaction/plan.json"
          action="$(jq -r '.next_action' "$RUNNER_TEMP/release-transaction/plan.json")"
          echo "count=$count" >>"$GITHUB_OUTPUT"
          echo "action=$action" >>"$GITHUB_OUTPUT"
          if [ "$action" = SIGN_AUTHOR ]; then
            # Recovery code may reconcile an older target, but only the exact
            # target checkout is authorized to create a new author signature.
            test "$RELEASE_TARGET" = "$GITHUB_SHA"
            echo "needs_sign=true" >>"$GITHUB_OUTPUT"
          else
            echo "needs_sign=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Sign the exact durable envelope once
        if: steps.transaction.outputs.mode != 'immutable' && steps.author.outputs.needs_sign == 'true'
        uses: actions/attest@v4
        with:
          subject-path: build/release/continuum-release-envelope-v2.json

      - name: Materialize author proof and reconcile draft assets
        if: steps.transaction.outputs.mode != 'immutable'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          cd build/release
          rm -f sha256:*.jsonl
          for attempt in $(seq 1 12); do
            if gh attestation download continuum-release-envelope-v2.json \
              --repo "$GITHUB_REPOSITORY"; then break; fi
            sleep 5
          done
          mapfile -t bundles < <(find . -maxdepth 1 -type f -name 'sha256:*.jsonl')
          test "${#bundles[@]}" = 1
          if [ -f continuum-release-envelope-v2.sigstore.jsonl ]; then
            cmp "${bundles[0]}" continuum-release-envelope-v2.sigstore.jsonl
            rm "${bundles[0]}"
          else
            mv "${bundles[0]}" continuum-release-envelope-v2.sigstore.jsonl
          fi
          test "$(wc -l <continuum-release-envelope-v2.sigstore.jsonl)" = 1
          gh attestation verify continuum-release-envelope-v2.json \
            --repo "$GITHUB_REPOSITORY" \
            --bundle continuum-release-envelope-v2.sigstore.jsonl \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-envelope.yml" \
            --source-ref refs/heads/main \
            --source-digest "$RELEASE_TARGET" \
            --deny-self-hosted-runners
          sha256sum continuum-release-envelope-v2.sigstore.jsonl \
            >continuum-release-envelope-v2.sigstore.jsonl.sha256
          cd "$GITHUB_WORKSPACE"

          receipt=build/release/release-transaction-receipt.json
          if [ "$(jq -r '.state' "$receipt")" = PREPARED ]; then
            jq -n \
              --arg author_bundle_sha256 "$(sha256sum build/release/continuum-release-envelope-v2.sigstore.jsonl | cut -d' ' -f1)" \
              --arg signer_workflow "$GITHUB_REPOSITORY/.github/workflows/release-envelope.yml" \
              '{author_attestation_count:1,author_bundle_sha256:$author_bundle_sha256,signer_workflow:$signer_workflow,source_ref:"refs/heads/main",rekor_log:"https://rekor.sigstore.dev"}' \
              >"$RUNNER_TEMP/release-transaction/author.json"
            python scripts/release_transaction_coordinator.py advance \
              --input "$receipt" \
              --to-state AUTHOR_ATTESTED \
              --evidence "$RUNNER_TEMP/release-transaction/author.json" \
              --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --output "$RUNNER_TEMP/release-transaction/author-receipt.json"
            mv "$RUNNER_TEMP/release-transaction/author-receipt.json" "$receipt"
          fi

          release_id="$(jq -r '.events[0].evidence.release_id' "$receipt")"
          upload_draft_asset() {
            path="$1"
            name="${path##*/}"
            while read -r existing_id; do
              if [ -n "$existing_id" ]; then
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$existing_id"
              fi
            done < <(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              --jq ".[] | select(.name == \"$name\") | .id")
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              --input "$path" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$name" \
              >/dev/null
          }
          upload_draft_asset \
            build/release/continuum-release-envelope-v2.sigstore.jsonl
          upload_draft_asset \
            build/release/continuum-release-envelope-v2.sigstore.jsonl.sha256

          python - <<'PY' >"$RUNNER_TEMP/release-transaction/expected-assets.json"
          import hashlib, json
          from pathlib import Path
          names = (
              "continuum-release-envelope-v2.json",
              "continuum-release-envelope-v2.json.sha256",
              "continuum-release-envelope-v2.sigstore.jsonl",
              "continuum-release-envelope-v2.sigstore.jsonl.sha256",
              "sandbox-provider-proof.json",
              "sandbox-provider-proof.json.sha256",
              "agent-ablation-v3.json",
              "agent-ablation-v3.json.sha256",
              "episode-drilldown-v1.json",
              "episode-drilldown-v1.json.sha256",
              "release-guardian-v1.json",
              "release-guardian-v1.json.sha256",
              "release-guardian-replication-v1.json",
              "release-guardian-replication-v1.json.sha256",
              "blind-holdout-v1.json",
              "blind-holdout-v1.json.sha256",
              "sequential-blind-v1.json",
              "sequential-blind-v1.json.sha256",
              "evidence-story-v1.json",
              "evidence-story-v1.json.sha256",
              "provider-origin-story-v1.json",
              "provider-origin-story-v1.json.sha256",
              "ci-recovery-v1.json",
              "ci-recovery-v1.json.sha256",
              "adaptive-diagnosis-v1.json",
              "adaptive-diagnosis-v1.json.sha256",
              "transfer-firewall-v1.json",
              "transfer-firewall-v1.json.sha256",
              "online-memory-lineage-v1.json",
              "online-memory-lineage-v1.json.sha256",
              "outcome-replay-cas-v1.json",
              "outcome-replay-cas-v1.json.sha256",
              "kms-authority-lifecycle-v1.json",
              "kms-authority-lifecycle-v1.json.sha256",
              "judge-offline-capsule-v1.json",
              "judge-offline-capsule-v1.json.sha256",
          )
          root = Path("build/release")
          print(json.dumps({name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in names}, sort_keys=True))
          PY
          release="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/releases/$release_id")"
          jq '[.assets[] | {key:.name,value:(.digest | sub("^sha256:";""))}] | from_entries' \
            <<<"$release" >"$RUNNER_TEMP/release-transaction/observed-assets.json"
          jq -n \
            --argjson expected_asset_digests "$(cat "$RUNNER_TEMP/release-transaction/expected-assets.json")" \
            --argjson observed_all "$(cat "$RUNNER_TEMP/release-transaction/observed-assets.json")" \
            '$expected_asset_digests as $expected | {release_draft:true,expected_asset_digests:$expected,observed_asset_digests:($observed_all | with_entries(select(.key as $key | $expected | has($key))))}' \
            >"$RUNNER_TEMP/release-transaction/assets.json"
          test "$(jq -r '.state' "$receipt")" = AUTHOR_ATTESTED -o \
            "$(jq -r '.state' "$receipt")" = ASSETS_UPLOADED
          if [ "$(jq -r '.state' "$receipt")" = AUTHOR_ATTESTED ]; then
            python scripts/release_transaction_coordinator.py advance \
              --input "$receipt" \
              --to-state ASSETS_UPLOADED \
              --evidence "$RUNNER_TEMP/release-transaction/assets.json" \
              --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --output "$RUNNER_TEMP/release-transaction/assets-receipt.json"
            mv "$RUNNER_TEMP/release-transaction/assets-receipt.json" "$receipt"
          fi
          python scripts/release_transaction_coordinator.py verify \
            --input "$receipt" --expected-state ASSETS_UPLOADED
          upload_draft_asset "$receipt"

      - name: Publish or adopt the immutable provider receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TRANSACTION_MODE: ${{ steps.transaction.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          receipt=build/release/release-transaction-receipt.json
          release_id="$(jq -r '.events[0].evidence.release_id' "$receipt")"
          if [ "$TRANSACTION_MODE" != immutable ]; then
            gh api --method PATCH \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              -F draft=false \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              >/dev/null
          fi
          for attempt in $(seq 1 12); do
            release="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/releases/$release_id")"
            if [ "$(jq -r '.immutable' <<<"$release")" = true ]; then break; fi
            sleep 5
          done
          test "$(jq -r '.immutable' <<<"$release")" = true
          test "$(jq -r '.draft' <<<"$release")" = false
          test "$(jq -r '.target_commitish' <<<"$release")" = "$RELEASE_TARGET"
          envelope_digest="$(jq -r '.envelope_sha256' build/release/release-transaction-receipt.json)"
          # Release immutability and attestation indexes are separate provider
          # reads. The release may become immutable a few seconds before both
          # attestations are visible, so reconcile that bounded propagation
          # window instead of requiring a second workflow attempt.
          for attempt in $(seq 1 12); do
            all="$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/attestations/sha256:$envelope_digest")"
            author="$(gh api --method GET -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/attestations/sha256:$envelope_digest" \
              -f 'predicate_type=https://slsa.dev/provenance/v1')"
            platform="$(gh api --method GET -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/attestations/sha1:$RELEASE_TARGET" \
              -f 'predicate_type=https://in-toto.io/attestation/release/v0.2')"
            if [ "$(jq '.attestations | length' <<<"$all")" = 2 ] && \
               [ "$(jq '.attestations | length' <<<"$author")" = 1 ] && \
               [ "$(jq '.attestations | length' <<<"$platform")" = 1 ]; then
              break
            fi
            sleep 5
          done
          test "$(jq '.attestations | length' <<<"$all")" = 2
          test "$(jq '.attestations | length' <<<"$author")" = 1
          test "$(jq '.attestations | length' <<<"$platform")" = 1
          jq -n \
            --arg release_target "$RELEASE_TARGET" \
            --arg release_tag "$RELEASE_TAG" \
            --arg coordinator_sha "$GITHUB_SHA" \
            '{immutable:true,release_draft:false,release_target:$release_target,release_tag:$release_tag,author_attestation_count:1,platform_attestation_count:1,total_attestation_count:2,coordinator_sha:$coordinator_sha}' \
            >"$RUNNER_TEMP/release-transaction/immutable.json"
          test "$(jq -r '.state' "$receipt")" = ASSETS_UPLOADED
          python scripts/release_transaction_coordinator.py advance \
            --input "$receipt" \
            --to-state IMMUTABLE \
            --evidence "$RUNNER_TEMP/release-transaction/immutable.json" \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "$RUNNER_TEMP/release-transaction/immutable-receipt.json"
          mv "$RUNNER_TEMP/release-transaction/immutable-receipt.json" "$receipt"
          python scripts/release_transaction_coordinator.py verify \
            --input "$receipt" --expected-state IMMUTABLE
          jq '{id,tag_name,target_commitish,immutable,assets:[.assets[]|{name,state,digest}]}' <<<"$release"

      - id: transaction-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: release-transaction-${{ inputs.release_tag }}-${{ github.sha }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 90

      - name: Materialize the final receipt through Pages
        env:
          GH_TOKEN: ${{ github.token }}
          COORDINATOR_ARTIFACT_ID: ${{ steps.transaction-artifact.outputs.artifact-id }}
          COORDINATOR_ARTIFACT_DIGEST: ${{ steps.transaction-artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          coordinator_artifact_digest="$COORDINATOR_ARTIFACT_DIGEST"
          if [[ "$coordinator_artifact_digest" =~ ^[0-9a-f]{64}$ ]]; then
            coordinator_artifact_digest="sha256:$coordinator_artifact_digest"
          fi
          [[ "$COORDINATOR_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$coordinator_artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh workflow run pages.yml --ref main \
            -f coordinator_workflow_run_id="$GITHUB_RUN_ID" \
            -f coordinator_source_digest="$GITHUB_SHA" \
            -f coordinator_artifact_id="$COORDINATOR_ARTIFACT_ID" \
            -f coordinator_artifact_digest="$coordinator_artifact_digest"
