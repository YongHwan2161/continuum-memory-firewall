name: aws-sandbox-provider-proof

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: continuum-sandbox-provider-proof
  cancel-in-progress: false

jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: continuum-production
    env:
      AWS_REGION: ap-southeast-1
      CONTINUUM_MCP_STACK_NAME: continuum-authenticated-mcp
      CONTINUUM_SANDBOX_STACK_NAME: continuum-sandbox-provider
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Require reviewed main lineage
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: continuum-sandbox-provider-proof
      - name: Prove dedicated deployment role
        run: ./scripts/assert_deployer_identity.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: "3.12"
      - name: Build and stage bounded sandbox provider
        shell: bash
        run: |
          set -euo pipefail
          package_bucket="$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$CONTINUUM_MCP_STACK_NAME" \
            --query "Stacks[0].Parameters[?ParameterKey=='PackageBucket'].ParameterValue | [0]" \
            --output text)"
          test -n "$package_bucket"
          test "$package_bucket" != "None"
          stage="$(mktemp -d)"
          cp src/continuum/aws_sandbox_provider_handler.py "$stage/"
          (
            cd "$stage"
            zip -q "$GITHUB_WORKSPACE/sandbox-provider.zip" \
              aws_sandbox_provider_handler.py
          )
          test "$(unzip -Z1 sandbox-provider.zip)" = \
            "aws_sandbox_provider_handler.py"
          key="sandbox-provider/${GITHUB_SHA}.zip"
          aws s3 cp sandbox-provider.zip "s3://${package_bucket}/${key}" --only-show-errors
          echo "CONTINUUM_PACKAGE_BUCKET=${package_bucket}" >> "$GITHUB_ENV"
          echo "CONTINUUM_PACKAGE_KEY=${key}" >> "$GITHUB_ENV"
      - name: Deploy actual Lambda and DynamoDB sandbox
        shell: bash
        run: |
          set -euo pipefail
          stack_status=""
          if stack_status="$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$CONTINUUM_SANDBOX_STACK_NAME" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null)"; then
            if [[ "$stack_status" == "ROLLBACK_COMPLETE" ]]; then
              aws cloudformation delete-stack \
                --region "$AWS_REGION" \
                --stack-name "$CONTINUUM_SANDBOX_STACK_NAME"
              aws cloudformation wait stack-delete-complete \
                --region "$AWS_REGION" \
                --stack-name "$CONTINUUM_SANDBOX_STACK_NAME"
            fi
          fi
          if ! aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name "$CONTINUUM_SANDBOX_STACK_NAME" \
            --template-file infra/aws/sandbox-provider-template.json \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              DeploymentBucket="$CONTINUUM_PACKAGE_BUCKET" \
              DeploymentKey="$CONTINUUM_PACKAGE_KEY" \
            --tags \
              Project=continuum-memory-firewall \
              Environment=sandbox \
              SourceHead="$GITHUB_SHA" \
            --no-fail-on-empty-changeset; then
            aws cloudformation describe-stack-events \
              --region "$AWS_REGION" \
              --stack-name "$CONTINUUM_SANDBOX_STACK_NAME" \
              --query 'StackEvents[?contains(ResourceStatus, `FAILED`)].{LogicalId:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' \
              --output table || true
            exit 1
          fi
      - name: Invoke adapter, replay, and receipt lookup
        env:
          PYTHONPATH: src
        run: |
          python -m pip install 'boto3>=1.40,<2'
          function_name="$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$CONTINUUM_SANDBOX_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FunctionName'].OutputValue | [0]" \
            --output text)"
          python scripts/run_live_sandbox_provider.py \
            --function-name "$function_name" \
            --region "$AWS_REGION" \
            --source-head "$GITHUB_SHA" \
            --output sandbox-provider-proof.json
      - name: Validate and hash evidence
        run: |
          jq -e '
            .source_head == env.GITHUB_SHA and
            .logical_effect_count == 1 and
            .send_count == 2 and
            .receipt_lookup_matched == true and
            .provider_capabilities.supports_idempotency == true and
            .provider_capabilities.receipt_lookup == true and
            .gate.idempotency == "PASS" and
            .gate.receipt_lookup == "PASS"
          ' sandbox-provider-proof.json >/dev/null
          sha256sum sandbox-provider-proof.json | tee sandbox-provider-proof.sha256
          jq '{schema_version,source_head,provider,provider_capabilities,send_count,logical_effect_count,receipt_lookup_matched,gate}' sandbox-provider-proof.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1, Node 24
        with:
          name: aws-sandbox-provider-proof-${{ github.sha }}
          path: |
            sandbox-provider-proof.json
            sandbox-provider-proof.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Remove staging artifact
        if: always() && env.CONTINUUM_PACKAGE_BUCKET != '' && env.CONTINUUM_PACKAGE_KEY != ''
        run: |
          aws s3 rm \
            "s3://${CONTINUUM_PACKAGE_BUCKET}/${CONTINUUM_PACKAGE_KEY}" \
            --only-show-errors
