name: aws-online-memory-lineage

on:
  workflow_dispatch:
    inputs:
      campaign_prefix:
        description: Stable online lineage campaign prefix
        required: true
        default: online-lineage-v1
        type: string

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: continuum-online-memory-lineage
  cancel-in-progress: false

jobs:
  provider-db-provider-lineage:
    runs-on: ubuntu-latest
    environment: continuum-production
    timeout-minutes: 80
    env:
      AWS_REGION: ap-southeast-1
      CONTINUUM_EMBEDDING_REGION: ap-northeast-2
      CONTINUUM_AGENT_REGION: ap-southeast-2
      CONTINUUM_AGENT_MODEL: amazon.nova-micro-v1:0
      CONTINUUM_MCP_STACK_NAME: continuum-authenticated-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0, Node 24
        with:
          python-version: "3.12"
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3, Node 24
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: continuum-online-lineage
      - name: Prove reviewed main-only deployment identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          ./scripts/assert_deployer_identity.sh
      - name: Resolve fixed-egress runtime and checksum-addressed evidence keys
        shell: bash
        run: |
          set -euo pipefail
          parameter() {
            aws cloudformation describe-stacks --region "$AWS_REGION" \
              --stack-name "$CONTINUUM_MCP_STACK_NAME" \
              --query "Stacks[0].Parameters[?ParameterKey=='$1'].ParameterValue | [0]" \
              --output text
          }
          output() {
            aws cloudformation describe-stacks --region "$AWS_REGION" \
              --stack-name "$CONTINUUM_MCP_STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" \
              --output text
          }
          runtime_secret_arn="$(parameter RuntimeSecretArn)"
          deploy_bucket="$(parameter PackageBucket)"
          deploy_key="$(parameter PackageKey)"
          instance_role_arn="$(output RuntimeRoleArn)"
          instance_id="$(output InstanceId)"
          prefix="evidence/online-memory-lineage/$GITHUB_SHA/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test -n "$runtime_secret_arn" && test "$runtime_secret_arn" != None
          test -n "$deploy_bucket" && test "$deploy_bucket" != None
          test -n "$instance_id" && test "$instance_id" != None
          aws s3 cp "s3://$deploy_bucket/$deploy_key" /tmp/continuum-current.zip \
            --region "$AWS_REGION" --only-show-errors
          unzip -p /tmp/continuum-current.zip cockroach-ca.crt >/tmp/cockroach-ca.crt
          chmod 0600 /tmp/cockroach-ca.crt
          test -s /tmp/cockroach-ca.crt
          echo "CONTINUUM_RUNTIME_SECRET_ARN=$runtime_secret_arn" >>"$GITHUB_ENV"
          echo "CONTINUUM_DEPLOY_BUCKET=$deploy_bucket" >>"$GITHUB_ENV"
          echo "CONTINUUM_INSTANCE_ROLE_NAME=${instance_role_arn##*/}" >>"$GITHUB_ENV"
          echo "CONTINUUM_INSTANCE_ID=$instance_id" >>"$GITHUB_ENV"
          echo "CONTINUUM_LINEAGE_PREFIX=$prefix" >>"$GITHUB_ENV"
      - name: Install exact-head provider controller
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "boto3>=1.40,<2" -e .
      - name: Deploy exact-head database runtime
        shell: bash
        run: |
          set -euo pipefail
          stack_status="$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$CONTINUUM_MCP_STACK_NAME" \
            --query 'Stacks[0].StackStatus' --output text)"
          if [[ "$stack_status" == "UPDATE_ROLLBACK_FAILED" || \
                "$stack_status" == "UPDATE_ROLLBACK_COMPLETE" ]]; then
            ./scripts/deploy_mcp_host_direct_recovery.sh
          else
            ./scripts/deploy_mcp_host.sh
          fi
          artifact_sha="$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$CONTINUUM_MCP_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactSha256'].OutputValue | [0]" \
            --output text)"
          test "${#artifact_sha}" = 64
          echo "CONTINUUM_LINEAGE_DEPLOYMENT_ARTIFACT_SHA256=$artifact_sha" >>"$GITHUB_ENV"
      - name: Generate and seal the transfer challenge before provider calls
        shell: bash
        run: |
          set -euo pipefail
          work=build/evidence/online-memory-lineage
          mkdir -p "$work"
          nonce="workflow-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          PYTHONPATH=src:. python scripts/generate_transfer_firewall.py \
            --source-head "$GITHUB_SHA" \
            --generation-nonce "$nonce" \
            --output-dir "$work"
          PYTHONPATH=src:. python scripts/seal_transfer_firewall.py \
            --region "$AWS_REGION" \
            --bucket "$CONTINUUM_DEPLOY_BUCKET" \
            --prefix "$CONTINUUM_LINEAGE_PREFIX/seal" \
            --challenge "$work/transfer-firewall-challenge-v1.json" \
            --labels "$work/transfer-firewall-labels-v1.json" \
            --commitment "$work/transfer-firewall-commitment-v1.json" \
            --output "$work/transfer-firewall-seal-receipt-v1.json" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Acquire source, target-attestation, and bounded diagnostic receipts
        env:
          TRANSFER_GITHUB_TOKEN: ${{ github.token }}
          CAMPAIGN_PREFIX: ${{ inputs.campaign_prefix }}
        shell: bash
        run: |
          set -euo pipefail
          work=build/evidence/online-memory-lineage
          campaign_id="${CAMPAIGN_PREFIX}-${GITHUB_RUN_ID}"
          PYTHONPATH=src:. python scripts/run_online_lineage_provider.py prepare \
            --repository "$GITHUB_REPOSITORY" \
            --source-head "$GITHUB_SHA" \
            --ref main \
            --campaign-id "$campaign_id" \
            --challenge "$work/transfer-firewall-challenge-v1.json" \
            --labels "$work/transfer-firewall-labels-v1.json" \
            --commitment "$work/transfer-firewall-commitment-v1.json" \
            --seal-receipt "$work/transfer-firewall-seal-receipt-v1.json" \
            --output "$work/provider-preparation-v1.json"
      - name: Grant one-command secret and exact-prefix S3 access
        shell: bash
        run: |
          set -euo pipefail
          migrator_arn="$(aws secretsmanager describe-secret \
            --region "$AWS_REGION" \
            --secret-id continuum/cockroach/sql-migrator \
            --query ARN --output text)"
          prefix_arn="arn:aws:s3:::$CONTINUUM_DEPLOY_BUCKET/$CONTINUUM_LINEAGE_PREFIX/*"
          policy="$(jq -cn \
            --arg migrator "$migrator_arn" \
            --arg runtime "$CONTINUUM_RUNTIME_SECRET_ARN" \
            --arg prefix "$prefix_arn" \
            '{Version:"2012-10-17",Statement:[
              {Effect:"Allow",Action:"secretsmanager:GetSecretValue",Resource:[$migrator,$runtime]},
              {Effect:"Allow",Action:["s3:GetObject","s3:PutObject"],Resource:$prefix}
            ]}')"
          aws iam put-role-policy \
            --role-name "$CONTINUUM_INSTANCE_ROLE_NAME" \
            --policy-name ContinuumOnlineLineageOneCommand \
            --policy-document "$policy"
          sleep 10
      - name: Upload provider preparation without credentials
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp build/evidence/online-memory-lineage/provider-preparation-v1.json \
            "s3://$CONTINUUM_DEPLOY_BUCKET/$CONTINUUM_LINEAGE_PREFIX/provider-preparation-v1.json" \
            --region "$AWS_REGION" --only-show-errors
      - name: Promote source, run scoped vector retrieval, and persist proposals
        shell: bash
        run: |
          set -euo pipefail
          command_text="set -eu
          work=\$(mktemp -d /run/continuum-online-lineage.XXXXXX)
          trap 'rm -rf -- \"\$work\"' EXIT
          aws s3 cp 's3://$CONTINUUM_DEPLOY_BUCKET/$CONTINUUM_LINEAGE_PREFIX/provider-preparation-v1.json' \"\$work/provider.json\" --region '$AWS_REGION' --only-show-errors
          cd /opt/continuum
          /opt/continuum/.venv/bin/python scripts/run_online_memory_lineage.py prepare \
            --region '$AWS_REGION' \
            --embedding-region '$CONTINUUM_EMBEDDING_REGION' \
            --agent-region '$CONTINUUM_AGENT_REGION' \
            --agent-model '$CONTINUUM_AGENT_MODEL' \
            --migrator-secret-id continuum/cockroach/sql-migrator \
            --runtime-secret-id '$CONTINUUM_RUNTIME_SECRET_ARN' \
            --ca-cert /opt/continuum/cockroach-ca.crt \
            --source-head '$GITHUB_SHA' \
            --deployment-artifact-sha256 '$CONTINUUM_LINEAGE_DEPLOYMENT_ARTIFACT_SHA256' \
            --provider-preparation \"\$work/provider.json\" \
            --output \"\$work/proposals.json\"
          aws s3 cp \"\$work/proposals.json\" 's3://$CONTINUUM_DEPLOY_BUCKET/$CONTINUUM_LINEAGE_PREFIX/proposals-v1.json' --region '$AWS_REGION' --only-show-errors"
          parameters="$(jq -cn --arg command "$command_text" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$CONTINUUM_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'online provider-to-cockroach proposal lineage' \
            --parameters "$parameters" \
            --query 'Command.CommandId' --output text)"
          status=Pending
          for _attempt in $(seq 1 360); do
            status="$(aws ssm get-command-invocation \
              --region "$AWS_REGION" --command-id "$command_id" \
              --instance-id "$CONTINUUM_INSTANCE_ID" --query Status --output text)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation \
            --region "$AWS_REGION" --command-id "$command_id" \
            --instance-id "$CONTINUUM_INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output table
          test "$status" = Success
      - name: Download and validate durable proposals
        shell: bash
        run: |
          set -euo pipefail
          work=build/evidence/online-memory-lineage
          aws s3 cp \
            "s3://$CONTINUUM_DEPLOY_BUCKET/$CONTINUUM_LINEAGE_PREFIX/proposals-v1.json" \
            "$work/proposals-v1.json" --region "$AWS_REGION" --only-show-errors
          jq -e '
            .kind == "continuum.online-memory-lineage.proposals" and
            .source_head == env.GITHUB_SHA and
            .deployment_artifact_sha256 == env.CONTINUUM_LINEAGE_DEPLOYMENT_ARTIFACT_SHA256 and
            .migration_version >= 31 and
            (.proposals | length) == 2 and
            ([.proposals[].admission_receipt.retrieval_ids | length] | all(. >= 1)) and
            .isolation.forbidden_memory_visible == false
          ' "$work/proposals-v1.json" >/dev/null
      - name: Execute only the two durable target proposals
        env:
          TRANSFER_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          work=build/evidence/online-memory-lineage
          PYTHONPATH=src:. python scripts/run_online_lineage_provider.py execute \
            --prepared "$work/provider-preparation-v1.json" \
            --proposals "$work/proposals-v1.json" \
            --output "$work/provider-outcomes-v1.json"
          aws s3 cp "$work/provider-outcomes-v1.json" \
            "s3://$CONTINUUM_DEPLOY_BUCKET/$CONTINUUM_LINEAGE_PREFIX/provider-outcomes-v1.json" \
            --region "$AWS_REGION" --only-show-errors
      - name: Reconcile outcomes and promote only provider success
        shell: bash
        run: |
          set -euo pipefail
          command_text="set -eu
          work=\$(mktemp -d /run/continuum-online-lineage-final.XXXXXX)
          trap 'rm -rf -- \"\$work\"' EXIT
          aws s3 cp 's3://$CONTINUUM_DEPLOY_BUCKET/$CONTINUUM_LINEAGE_PREFIX/proposals-v1.json' \"\$work/proposals.json\" --region '$AWS_REGION' --only-show-errors
          aws s3 cp 's3://$CONTINUUM_DEPLOY_BUCKET/$CONTINUUM_LINEAGE_PREFIX/provider-outcomes-v1.json' \"\$work/outcomes.json\" --region '$AWS_REGION' --only-show-errors
          cd /opt/continuum
          /opt/continuum/.venv/bin/python scripts/run_online_memory_lineage.py finalize \
            --region '$AWS_REGION' \
            --embedding-region '$CONTINUUM_EMBEDDING_REGION' \
            --migrator-secret-id continuum/cockroach/sql-migrator \
            --runtime-secret-id '$CONTINUUM_RUNTIME_SECRET_ARN' \
            --ca-cert /opt/continuum/cockroach-ca.crt \
            --proposals \"\$work/proposals.json\" \
            --provider-outcomes \"\$work/outcomes.json\" \
            --output \"\$work/report.json\"
          aws s3 cp \"\$work/report.json\" 's3://$CONTINUUM_DEPLOY_BUCKET/$CONTINUUM_LINEAGE_PREFIX/online-memory-lineage-v1.json' --region '$AWS_REGION' --only-show-errors"
          parameters="$(jq -cn --arg command "$command_text" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$CONTINUUM_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'online cockroach outcome reconciliation' \
            --parameters "$parameters" \
            --query 'Command.CommandId' --output text)"
          status=Pending
          for _attempt in $(seq 1 240); do
            status="$(aws ssm get-command-invocation \
              --region "$AWS_REGION" --command-id "$command_id" \
              --instance-id "$CONTINUUM_INSTANCE_ID" --query Status --output text)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation \
            --region "$AWS_REGION" --command-id "$command_id" \
            --instance-id "$CONTINUUM_INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output table
          test "$status" = Success
      - name: Validate the complete online memory lineage
        shell: bash
        run: |
          set -euo pipefail
          work=build/evidence/online-memory-lineage
          report="$work/online-memory-lineage-v1.json"
          aws s3 cp \
            "s3://$CONTINUUM_DEPLOY_BUCKET/$CONTINUUM_LINEAGE_PREFIX/online-memory-lineage-v1.json" \
            "$report" --region "$AWS_REGION" --only-show-errors
          jq -e '
            .schema_version == 1 and
            .kind == "continuum.online-memory-lineage.report" and
            .source_head == env.GITHUB_SHA and
            .deployment_artifact_sha256 == env.CONTINUUM_LINEAGE_DEPLOYMENT_ARTIFACT_SHA256 and
            .methodology.target_cases == 2 and
            .methodology.same_cause_cases == 1 and
            .methodology.near_neighbor_cases == 1 and
            .gate.same_cause_memory_selected == true and
            .gate.same_cause_zero_diagnostics == true and
            .gate.near_neighbor_memory_not_selected == true and
            .gate.near_neighbor_current_diagnostic_used == true and
            .gate.both_provider_outcomes_succeeded == true and
            .gate.both_verified_outcomes_promoted == true and
            .gate.cross_scope_rows_zero == true and
            .gate.status == "PASS"
          ' "$report" >/dev/null
          sha256sum "$work"/*.json
      - name: Revoke temporary instance authority
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CONTINUUM_INSTANCE_ROLE_NAME:-}" ]]; then
            aws iam delete-role-policy \
              --role-name "$CONTINUUM_INSTANCE_ROLE_NAME" \
              --policy-name ContinuumOnlineLineageOneCommand || true
            if aws iam get-role-policy \
              --role-name "$CONTINUUM_INSTANCE_ROLE_NAME" \
              --policy-name ContinuumOnlineLineageOneCommand >/dev/null 2>&1; then
              echo "temporary online lineage authority remains attached" >&2
              exit 1
            fi
          fi
          rm -f -- /tmp/continuum-current.zip /tmp/cockroach-ca.crt
      - name: Upload sealed challenge and complete lineage receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: continuum-online-memory-lineage-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/evidence/online-memory-lineage
          if-no-files-found: error
          retention-days: 90
