name: aws-vector-scale-benchmark

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: continuum-vector-scale-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    environment: continuum-production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: continuum-vector-scale
      - name: Prove dedicated deployment role
        run: ./scripts/assert_deployer_identity.sh
      - name: Resolve benchmark host and grant one-command secret read
        shell: bash
        run: |
          instance_id="$(aws cloudformation describe-stacks \
            --region ap-southeast-1 \
            --stack-name continuum-authenticated-mcp \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue | [0]" \
            --output text)"
          instance_role_arn="$(aws cloudformation describe-stacks \
            --region ap-southeast-1 \
            --stack-name continuum-authenticated-mcp \
            --query "Stacks[0].Outputs[?OutputKey=='RuntimeRoleArn'].OutputValue | [0]" \
            --output text)"
          migrator_arn="$(aws secretsmanager describe-secret \
            --region ap-southeast-1 \
            --secret-id continuum/cockroach/sql-migrator \
            --query ARN --output text)"
          test -n "$instance_id" && test "$instance_id" != None
          instance_role_name="${instance_role_arn##*/}"
          policy="$(jq -cn --arg migrator "$migrator_arn" \
            '{Version:"2012-10-17",Statement:[{Effect:"Allow",Action:"secretsmanager:GetSecretValue",Resource:$migrator}]}')"
          aws iam put-role-policy \
            --role-name "$instance_role_name" \
            --policy-name ContinuumVectorBenchmarkSecretRead \
            --policy-document "$policy"
          echo "CONTINUUM_INSTANCE_ID=$instance_id" >>"$GITHUB_ENV"
          echo "CONTINUUM_INSTANCE_ROLE_NAME=$instance_role_name" >>"$GITHUB_ENV"
          sleep 10
      - name: Run 10k and 50k benchmark through fixed egress
        shell: bash
        run: |
          script_b64="$(base64 -w0 src/continuum/scale_benchmark.py)"
          command_text="set -eu
          script=/run/continuum-vector-scale-benchmark.py
          report=/run/continuum-vector-scale-benchmark.json
          trap 'rm -f -- \"\$script\" \"\$report\"' EXIT
          printf '%s' '$script_b64' | base64 -d >\"\$script\"
          chmod 0600 \"\$script\"
          /opt/continuum/.venv/bin/python \"\$script\" \
            --region ap-southeast-1 \
            --secret-id continuum/cockroach/sql-migrator \
            --ca-cert /opt/continuum/cockroach-ca.crt \
            --source-head '$GITHUB_SHA' \
            --output \"\$report\""
          parameters="$(jq -cn --arg command "$command_text" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --region ap-southeast-1 \
            --instance-ids "$CONTINUUM_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'Synthetic 10k and 50k CockroachDB vector benchmark' \
            --parameters "$parameters" \
            --query 'Command.CommandId' --output text)"
          status=Pending
          for attempt in $(seq 1 360); do
            status="$(aws ssm get-command-invocation \
              --region ap-southeast-1 \
              --command-id "$command_id" \
              --instance-id "$CONTINUUM_INSTANCE_ID" \
              --query Status --output text)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation \
            --region ap-southeast-1 \
            --command-id "$command_id" \
            --instance-id "$CONTINUUM_INSTANCE_ID" \
            --query StandardOutputContent --output text \
            >"$RUNNER_TEMP/vector-scale.json"
          if [[ "$status" != Success ]]; then
            if jq -e '.schema_version == 1' "$RUNNER_TEMP/vector-scale.json" >/dev/null 2>&1; then
              jq '{source_head,gate,scales:[.scales[]|{row_count,index_contract,beams:[.beams[]|{beam_size,recall_by_k,query_plan}]}]}' \
                "$RUNNER_TEMP/vector-scale.json"
            fi
            aws ssm get-command-invocation \
              --region ap-southeast-1 \
              --command-id "$command_id" \
              --instance-id "$CONTINUUM_INSTANCE_ID" \
              --query '{Status:Status,ResponseCode:ResponseCode,Error:StandardErrorContent}' \
              --output table
            exit 1
          fi
          jq -e '
            .gate.status == "PASS" and
            .gate.natural_ann_selected_at_all_scales == true and
            .gate.cross_scope_leakage_zero == true and
            ([.scales[].row_count] == [10000,50000])
          ' "$RUNNER_TEMP/vector-scale.json" >/dev/null
          report_sha="$(sha256sum "$RUNNER_TEMP/vector-scale.json" | cut -d' ' -f1)"
          echo "vector_scale_report_sha256=$report_sha"
          jq '{source_head,gate,scales:[.scales[]|{row_count,query_count,exact_primary_scan_ms,beams:[.beams[]|{beam_size,recall_by_k,fresh_connection_first_pass_ms,same_connection_immediate_repeat_ms,query_plan}]}]}' \
            "$RUNNER_TEMP/vector-scale.json"
      - name: Upload immutable benchmark report
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1, Node 24
        with:
          name: continuum-vector-scale-${{ github.sha }}
          path: ${{ runner.temp }}/vector-scale.json
          if-no-files-found: error
          retention-days: 90
      - name: Revoke one-command secret read
        if: always()
        shell: bash
        run: |
          if [[ -n "${CONTINUUM_INSTANCE_ROLE_NAME:-}" ]]; then
            aws iam delete-role-policy \
              --role-name "$CONTINUUM_INSTANCE_ROLE_NAME" \
              --policy-name ContinuumVectorBenchmarkSecretRead || true
            if aws iam get-role-policy \
              --role-name "$CONTINUUM_INSTANCE_ROLE_NAME" \
              --policy-name ContinuumVectorBenchmarkSecretRead >/dev/null 2>&1; then
              echo "temporary benchmark secret read remains attached" >&2
              exit 1
            fi
            echo "benchmark_secret_read_absent=true"
          fi
